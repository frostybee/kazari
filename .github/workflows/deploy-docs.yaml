name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "demo/**"
      - "examples/hugo/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate demo pages
        run: |
          cd demo/site
          go run .

      - name: Copy demo output to docs
        run: |
          mkdir -p docs/public/demo/assets
          cp demo/site/*.html docs/public/demo/
          cp demo/site/showcase.css docs/public/demo/
          cp demo/site/showcase.js docs/public/demo/
          cp demo/site/assets/* docs/public/demo/assets/

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest

      - name: Build example Hugo site
        env:
          HUGO_RELATIVEURLS: "false"
          HUGO_UGLYURLS: "false"
        run: |
          hugo --source examples/hugo \
               --destination "$GITHUB_WORKSPACE/examples/hugo/public" \
               --baseURL /kazari/examples/hugo/ \
               --minify

      - name: Process example site with Kazari
        run: go run ./cmd/kazari process examples/hugo/public

      - name: Copy example site to docs output
        run: |
          mkdir -p docs/public/examples/hugo
          cp -r examples/hugo/public/* docs/public/examples/hugo/

      - uses: actions/configure-pages@v5

      # No build-args: docs/sarde.yaml already sets site.url and
      # base_path: /kazari/. --baseURL overrides site.url rather than the path
      # prefix, so passing it here would corrupt canonical links, OG tags, the
      # sitemap, and the feeds.
      - uses: getsarde/action@v1
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
