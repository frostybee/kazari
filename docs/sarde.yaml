site:
  title: "Kazari"
  description: "Framed, syntax-highlighted HTML code blocks for Go"
  url: "https://frostybee.github.io"
  # Page paths are appended relative to the content dir, so this must end at docs/content.
  edit_url: "https://github.com/frostybee/kazari/edit/main/docs/content"
  # The favicon art is the reduced variant of kazari.svg, drawn to stay legible at
  # small sizes, so it doubles as the header logo. Its mid slate blue tile keeps
  # its edges in both themes. Alt is left empty because the site title beside it
  # already names the link.
  logo: "/favicon.svg"
  favicon: "/favicon.svg"
build:
  base_path: /kazari/
theme:
  preset: "docs"
  dark: true
  font_family: "'Inter', system-ui, -apple-system, sans-serif"

  # preset: "ocean"        # Try: ocean, forest, rose, clean, minimal, docs, academic
  # overrides:
  #   primary: "#6366f1"

social:
- icon: github
  label: GitHub
  url: https://github.com/frostybee/kazari

collections:
  docs:
    sort: "order"
    tabs: false
    sidebar:
      collapsed_by_default: true
taxonomies:
  tags:
    singular: tag
    # Every tag must be declared in data/tags.yml. A tag that is only spelled in
    # front matter fails the build instead of silently creating a term page with
    # no label, color, or icon. This keeps the vocabulary from drifting as pages
    # are added. Unlike plugins.enabled below, this map merges with the built-in
    # defaults rather than replacing them.
    undefined_tags: error
toc:
  enabled: true
  max_level: 4
  min_level: 2
header:
  links:
  - label: Tags
    url: /tags/  
  - label: Changelog
    url: /docs/changelog  
  search: true
  social: true
  theme_toggle: true
markdown:
  asides:
    style: galaxy
  github_alerts: true
  katex: true
  mermaid: true
  triple_colon_callouts: true
  typographer: true
  unsafe: false
  codeblocks:
    engine: nuri
    light_theme: "github-light"
    dark_theme: "github-dark-default"

head:
  custom_css:
    - css/custom.css

plugins:
  # This list REPLACES Sarde's defaults rather than extending them, so every
  # default plugin has to be restated. Dropping one silently disables it.
  enabled:
    - search
    - seo
    - sitemap
    - robots
    - rss
    - atom
    - content_lint
    - link_validator
    - redirects
    - llms_txt
    - social_cards
    - scroll_to_top
    - keyboard_nav
    - reading_progress 
    - telescope
  config:
    social_cards:
      # Brand palette from the Kazari logo: code-panel charcoal background,
      # ribbon gradient cyan to pink. The PNG is rasterized from
      # brand/kazari-logo.svg (cards cannot use SVG directly) and serves as
      # both the corner mark and the watermark.
      bg_color: "#171821"
      accent_color: "#43C6D9"
      accent_color_2: "#FF6B81"
      logo: "/images/kazari-logo.png"
      watermark: true
    scroll_to_top:
      show_progress_ring: true
      show_tooltip: true
    keyboard_nav:
      # Keep arrow-key navigation, drop the on-load hint toast and the
      # chevron arrows pinned to the viewport edges.
      show_hint: false
      show_side_nav: true
    reading_progress:
      bar_height: 3.5
      bar_color: "#9122f9"  

homepage:
  hero:
    title: "Kazari"
    subtitle: "Framed, syntax-highlighted HTML code blocks with full CSS customization for Go."
    background: gradient
    cta:
      label: "Get Started"
      url: "/docs/getting-started"
      icon: rocket
    secondary_cta:
      label: "View Showcase"
      url: "/demo/showcase.html"
      icon: "briefcase"
    image:
      light: /images/hero-light.svg
      dark: /images/hero-dark.svg
      alt: "A Kazari code block with a title bar, line numbers, syntax colored code and one highlighted line"
