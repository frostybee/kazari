<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="kzHeroLightTitle kzHeroLightDesc">
  <title id="kzHeroLightTitle">Kazari</title>
  <desc id="kzHeroLightDesc">A framed code block with a title bar, line numbers, syntax colored code and one highlighted line, with the Kazari logo mark overlapping its lower right corner.</desc>
  <!-- Light hero. Same geometry as hero-dark.svg so the pair swaps cleanly under
       Sarde's light and dark image variants. The code block surface inverts to a
       paper panel and the token colours are darkened brand hues, since the logo's
       cyan, amber and pink are tuned for a near-black panel and wash out on
       white. The three terminal dots, the violet marker and the logo mark keep
       the logo's values unchanged: those read on both surfaces. -->
  <defs>
    <linearGradient id="kzPanelLight" x1="20" y1="26" x2="360" y2="254" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3F3FB"/>
    </linearGradient>
    <linearGradient id="kzMarkPanelLight" x1="308" y1="200" x2="380" y2="272" gradientUnits="userSpaceOnUse">
      <stop stop-color="#23243A"/>
      <stop offset="1" stop-color="#171821"/>
    </linearGradient>
    <!-- The logo's ribbon gradient, coordinates and stops unchanged. It is
         referenced from inside the scaled group below, so these logo space
         coordinates still line up with the logo space path data. -->
    <linearGradient id="kzRibbonLight" x1="156" y1="154" x2="328" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#43C6D9"/>
      <stop offset="0.5" stop-color="#7C5CFC"/>
      <stop offset="1" stop-color="#FF6B81"/>
    </linearGradient>
  </defs>

  <!-- Offset plate rather than a filter, so the art needs no filter support and
       stays resolution independent. -->
  <rect x="26" y="34" width="340" height="228" rx="16" fill="#3E4A7A" opacity="0.10"/>
  <rect x="20" y="26" width="340" height="228" rx="16" fill="url(#kzPanelLight)" stroke="#DEDFEE" stroke-width="1.5"/>

  <!-- Title bar: divider, terminal dots, file name, copy button -->
  <path d="M20 62h340" stroke="#E4E5F1" stroke-width="1.5"/>
  <circle cx="40" cy="44" r="4.5" fill="#FF6B81"/>
  <circle cx="56" cy="44" r="4.5" fill="#F7C85E"/>
  <circle cx="72" cy="44" r="4.5" fill="#43C6D9"/>
  <rect x="92" y="41" width="64" height="6" rx="3" fill="#6E7396"/>
  <g fill="none" stroke="#9AA0BE" stroke-width="1.5">
    <rect x="337" y="35" width="11" height="11" rx="3"/>
    <rect x="331" y="41" width="11" height="11" rx="3" fill="#FFFFFF"/>
  </g>

  <!-- Line number gutter -->
  <path d="M56 72v172" stroke="#E4E5F1" stroke-width="1.5"/>
  <g fill="#BCBFD6">
    <rect x="40" y="77.5" width="8" height="5" rx="2.5"/>
    <rect x="40" y="101.5" width="8" height="5" rx="2.5"/>
    <rect x="40" y="125.5" width="8" height="5" rx="2.5"/>
    <rect x="40" y="149.5" width="8" height="5" rx="2.5"/>
    <rect x="40" y="173.5" width="8" height="5" rx="2.5"/>
    <rect x="40" y="197.5" width="8" height="5" rx="2.5"/>
    <rect x="40" y="221.5" width="8" height="5" rx="2.5"/>
  </g>

  <!-- Marked line, the signature Kazari line marker: tinted band plus a solid
       gutter edge bar in the brand violet. -->
  <rect x="21" y="140" width="338" height="24" fill="#7C5CFC" opacity="0.10"/>
  <rect x="21" y="140" width="3" height="24" fill="#7C5CFC"/>

  <!-- Code tokens. Indents and widths vary so the block reads as tokenized code
       rather than placeholder bars. -->
  <g>
    <rect x="72" y="76.5" width="22" height="7" rx="3.5" fill="#6B4EE6"/>
    <rect x="100" y="76.5" width="52" height="7" rx="3.5" fill="#3A3D57"/>
    <rect x="158" y="76.5" width="12" height="7" rx="3.5" fill="#BCBFD6"/>
    <rect x="176" y="76.5" width="30" height="7" rx="3.5" fill="#A8760C"/>

    <rect x="84" y="100.5" width="18" height="7" rx="3.5" fill="#6B4EE6"/>
    <rect x="108" y="100.5" width="64" height="7" rx="3.5" fill="#1B8B9E"/>

    <rect x="84" y="124.5" width="40" height="7" rx="3.5" fill="#3A3D57"/>
    <rect x="130" y="124.5" width="14" height="7" rx="3.5" fill="#BCBFD6"/>
    <rect x="150" y="124.5" width="56" height="7" rx="3.5" fill="#1B8B9E"/>

    <rect x="84" y="148.5" width="26" height="7" rx="3.5" fill="#6B4EE6"/>
    <rect x="116" y="148.5" width="46" height="7" rx="3.5" fill="#3A3D57"/>
    <rect x="168" y="148.5" width="12" height="7" rx="3.5" fill="#8A8EA8"/>
    <rect x="186" y="148.5" width="34" height="7" rx="3.5" fill="#A8760C"/>

    <rect x="96" y="172.5" width="58" height="7" rx="3.5" fill="#3A3D57"/>
    <rect x="162" y="172.5" width="12" height="7" rx="3.5" fill="#BCBFD6"/>
    <rect x="182" y="172.5" width="44" height="7" rx="3.5" fill="#1B8B9E"/>
    <rect x="232" y="172.5" width="16" height="7" rx="3.5" fill="#BCBFD6"/>

    <rect x="96" y="196.5" width="36" height="7" rx="3.5" fill="#D93E56"/>
    <rect x="140" y="196.5" width="50" height="7" rx="3.5" fill="#8A8EA8"/>

    <rect x="72" y="220.5" width="14" height="7" rx="3.5" fill="#BCBFD6"/>
  </g>

  <!-- Logo mark, overlapping the frame corner for depth. Identical to the dark
       variant: the tile keeps the logo's dark panel gradient and its 0.196 corner
       ratio, and the K is the logo's own stem and folded ribbon path data, scaled
       in place. The logo is dark panelled by nature, and the dark tile is what
       anchors the composition against the paper frame. -->
  <rect x="311" y="203" width="72" height="72" rx="14" fill="#3E4A7A" opacity="0.18"/>
  <rect x="308" y="200" width="72" height="72" rx="14" fill="url(#kzMarkPanelLight)"/>
  <g transform="translate(344 236) scale(0.28) translate(-221.5 -272.5)">
    <path d="M160 196v152" fill="none" stroke="#F5F3FF" stroke-width="30" stroke-linecap="round"/>
    <path d="M160 270l104-76 28 38-56 40 62 57-32 35-106-94z" fill="url(#kzRibbonLight)" stroke-linejoin="round"/>
  </g>
</svg>
